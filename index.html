<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<style>
  :root { --ink: #fff6e8; --panel: rgba(46, 36, 78, 0.82); --panel2: rgba(70, 54, 112, 0.9); --gold: #f5c76b; --font: ui-rounded, "Segoe UI Rounded", "Nunito", "Trebuchet MS", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #2e244e; overflow: hidden; font-family: var(--font); color: var(--ink);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { font-variant-numeric: tabular-nums; }
  canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  canvas#game { position: fixed; inset: 0; pointer-events: none; display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; }

  #tl { position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(12px + env(safe-area-inset-top)); }
  #tl .row { display: flex; align-items: center; gap: 8px; font-size: 18px; }
  #clock { font-size: 15px; opacity: 0.92; margin-top: 2px; }
  #tc { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(440px, 46vw); pointer-events: none; }
  #tc > * { pointer-events: auto; }
  #quest { width: 100%; box-sizing: border-box; }
  .qt { font-size: 15px; color: var(--gold); font-weight: 700; margin-bottom: 2px; }
  .ql { font-size: 15px; display: flex; align-items: center; gap: 8px; line-height: 1.5; }
  .tick { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255, 246, 232, 0.6); box-sizing: border-box; flex: none; }
  .ql.ok .tick { background: #9cd27a; border-color: #9cd27a; }
  .ql.ok { color: #c8eab0; }
  #toasts { display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .toast { background: var(--panel2); border-radius: 14px; padding: 7px 14px; font-size: 15px; text-align: center; animation: pop 0.35s ease-out; }
  @keyframes pop { from { transform: translateY(-6px) scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
  #topbtns { position: fixed; right: calc(12px + env(safe-area-inset-right)); top: calc(12px + env(safe-area-inset-top)); display: flex; gap: 8px; }
  #chips { position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(130px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom)); background: rgba(255, 246, 232, 0.94); color: #3a2f55;
    border-radius: 16px; padding: 9px 16px; font-size: 16px; font-weight: 600; max-width: min(560px, 86vw); text-align: center; pointer-events: none; box-shadow: 0 4px 16px rgba(30, 20, 60, 0.2); }
  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 6px; padding: 8px; max-width: calc(100vw - 24px);
    overflow-x: auto; box-sizing: border-box; background: var(--panel); border-radius: 20px; touch-action: pan-x; -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: rgba(255, 246, 232, 0.4) transparent; overscroll-behavior: contain; }
  #bar::-webkit-scrollbar { height: 5px; } #bar::-webkit-scrollbar-thumb { background: rgba(255, 246, 232, 0.4); border-radius: 3px; }
  #cats { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(98px + env(safe-area-inset-bottom)); display: flex; gap: 6px; padding: 5px; max-width: calc(100vw - 24px);
    overflow-x: auto; box-sizing: border-box; background: var(--panel); border-radius: 16px; scrollbar-width: none; }
  .btn.cat { flex: none; padding: 4px 12px 4px 6px; font-size: 14px; gap: 5px; background: transparent; border-radius: 11px; }
  .btn.cat canvas { width: 22px; height: 22px; }
  .btn.cat.on { background: #7a6278; border-color: var(--gold); }
  .btn.tool.always { background: #463a6c; }
  body.testing #chips { top: calc(170px + env(safe-area-inset-top)); }
  .wrow { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; max-width: 260px; }
  .btn.wbtn { padding: 3px 8px; font-size: 12px; border-radius: 10px; background: #463a6c; }
  .btn.wbtn.on { background: #7a6278; border-color: var(--gold); }
  .btn.barArrow { position: sticky; z-index: 2; flex: none; align-self: stretch; padding: 0 4px; background: #3a2d63; box-shadow: 0 0 12px 6px rgba(46, 36, 78, 0.9); }
  .btn.barArrow.left { left: 0; } .btn.barArrow.right { right: 0; }
  #cambtns { position: fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(150px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 52px 52px; gap: 8px; }
  #back { position: fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); }
  .btn { font: inherit; color: var(--ink); background: var(--panel2); border: 2px solid transparent; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 15px; touch-action: manipulation; }
  .btn:hover { border-color: rgba(255, 246, 232, 0.35); }
  .btn:active { transform: scale(0.96); }
  .btn.tool { flex-direction: column; gap: 2px; min-width: 64px; padding: 6px 6px 4px; font-size: 14px; flex: none; background: #54447f; }
  .btn.tool.on { background: #7a6278; border-color: var(--gold); }
  .btn.small { padding: 6px 10px; }
  .btn.icononly { padding: 6px; }
  .btn.tool.spin { background: #3f5a6e; border: 2px dashed rgba(255, 246, 232, 0.45); }
  .btn.tool.spin canvas { transition: transform 0.2s ease; }
  #musicpanel { position: fixed; right: calc(12px + env(safe-area-inset-right)); top: calc(70px + env(safe-area-inset-top)); width: 240px; padding: 12px 14px; }
  #musicpanel .mpt { font-size: 15px; color: var(--gold); font-weight: 700; }
  #mptrack { font-size: 15px; margin: 2px 0 8px; }
  #musicpanel label { display: flex; align-items: center; gap: 10px; font-size: 15px; margin-top: 8px; }
  #musicpanel input[type=range] { flex: 1; accent-color: #f5c76b; height: 28px; }
  #relics { display: flex; gap: 6px; margin-top: 6px; }
  .btn.relic-slot { padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); opacity: 0.35; filter: grayscale(1); }
  .btn.relic-slot.found { opacity: 1; filter: none; background: rgba(245, 199, 107, 0.22); border-color: rgba(245, 199, 107, 0.7); box-shadow: 0 0 10px rgba(255, 215, 140, 0.55); }
  .btn.relic-slot .icon { width: 26px !important; height: 26px !important; }
  .btn.round { width: 52px; height: 52px; border-radius: 50%; justify-content: center; padding: 0; background: var(--panel); }
  .btn.sail { background: linear-gradient(180deg, #f7cf7b, #e9a95a); color: #3a2440; font-weight: 800; font-size: 18px; padding: 8px 20px; animation: glowpulse 1.6s ease-in-out infinite; }
  @keyframes glowpulse { 50% { box-shadow: 0 0 22px 4px rgba(255, 216, 140, 0.75); } }
  .btn.chip { font-size: 14px; padding: 5px 12px 5px 10px; background: var(--panel); }
  .btn.chip::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
  .btn.big { font-size: 20px; font-weight: 700; padding: 12px 34px; justify-content: center; background: linear-gradient(180deg, #f7cf7b, #e9a95a); color: #3a2440; }
  .btn.big.ghost { background: rgba(255, 255, 255, 0.12); color: var(--ink); }
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { background: rgba(46, 36, 78, 0.9); border-radius: 24px; padding: 22px 26px; max-width: 520px; width: 100%; box-sizing: border-box; text-align: center; box-shadow: 0 10px 40px rgba(20, 10, 50, 0.35);
    max-height: calc(100vh - 32px); overflow-y: auto; }
  #title { background: linear-gradient(180deg, rgba(46, 36, 78, 0) 30%, rgba(46, 36, 78, 0.35)); }
  #title .card { background: rgba(46, 36, 78, 0.72); }
  h1 { font-size: 64px; margin: 0; letter-spacing: 2px; font-weight: 800; color: #fff3dd; text-shadow: 0 4px 24px rgba(255, 190, 140, 0.6); }
  .sub { font-size: 19px; color: #ffd9b8; margin: 4px 0 14px; font-style: italic; }
  .controls { list-style: none; padding: 0; margin: 0 0 16px; font-size: 15px; line-height: 1.7; opacity: 0.95; }
  #begin, #pausebtns, #modalbtn { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .soft { font-size: 14px; opacity: 0.8; margin-top: 10px; }
  #modal { background: rgba(30, 20, 60, 0.35); }
  #modal h2 { margin: 6px 0 8px; font-size: 28px; color: #fff3dd; }
  #modal p { font-size: 16px; line-height: 1.5; margin: 6px 0; }
  .rar { display: inline-block; font-size: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #2e244e; background: var(--rc); padding: 4px 12px; border-radius: 10px; }
  .relic { background: rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 10px 12px; margin: 12px 0; }
  .relic b { color: var(--gold); font-size: 17px; }
  #modalicon canvas { width: 64px; height: 64px; }
  #voy { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top)); width: min(560px, 92vw); text-align: center; pointer-events: none; }
  #motes { display: flex; justify-content: center; gap: 4px; margin-bottom: 4px; }
  #voytext { font-size: 17px; font-weight: 700; }
  .icon { display: block; flex: none; }
  @media (max-width: 900px) {
    #tc { top: calc(70px + env(safe-area-inset-top)); width: calc(100vw - 24px); }
    #tl { padding: 6px 10px; }
    #tl .row { font-size: 16px; }
    #cats { bottom: calc(88px + env(safe-area-inset-bottom)); }
    .btn.cat { font-size: 13px; padding: 3px 10px 3px 5px; }
    body.testing #chips { top: auto; }
    #chips { top: auto; bottom: calc(210px + env(safe-area-inset-bottom)); }
    #topbtns .btn span { display: none; }
    .qt, .ql, .toast { font-size: 14px; }
    #hint { font-size: 14px; bottom: calc(136px + env(safe-area-inset-bottom)); }
    .btn.tool { min-width: 56px; font-size: 12px; }
    #cambtns { bottom: calc(190px + env(safe-area-inset-bottom)); grid-template-columns: 46px; }
    .btn.round { width: 46px; height: 46px; }
    h1 { font-size: 48px; }
  }
  @media (max-height: 520px) {
    #tc { top: calc(8px + env(safe-area-inset-top)); width: min(380px, 40vw); }
    #hint { bottom: calc(132px + env(safe-area-inset-bottom)); }
    #cambtns { bottom: calc(132px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<canvas id="world"></canvas>
<canvas id="game"></canvas>
<div id="hud" style="display:none">
  <div id="tl" class="panel"><div class="row"><span id="popicon"></span><b id="pop"></b></div><div id="clock"></div><div id="relics"></div></div>
  <div id="tc"><div id="quest" class="panel"></div><div id="sailwrap"></div><div id="toasts"></div></div>
  <div id="topbtns"></div>
  <div id="chips"></div>
  <div id="hint"></div>
  <div id="musicpanel" class="panel" style="display:none"><div class="mpt">Now playing</div><div id="mptrack"></div><div id="mpnext"></div>
    <label>Music <input type="range" id="mpmusic" min="0" max="1" step="0.05"></label>
    <label>Sounds <input type="range" id="mpsfx" min="0" max="1" step="0.05"></label>
    <div class="soft">[ and ] turn the music down and up</div></div>
</div>
<div id="cambtns" style="display:none"></div>
<div id="cats" style="display:none"></div>
<div id="bar" style="display:none"></div>
<div id="back" style="display:none"></div>
<div id="voy" style="display:none"><div class="panel"><div id="motes"></div><div id="voytext"></div>
  <div class="soft">Steer with the Left and Right arrow keys or A and D, or touch where you want the boat to go.</div></div></div>
<div id="modal" class="screen" style="display:none"><div class="card"><div id="modalicon"></div><div id="modaltext"></div><div id="modalbtn"></div></div></div>
<div id="pause" class="screen" style="display:none"><div class="card"><h2 style="font-size:32px;margin:0 0 14px">Paused</h2><div id="pausebtns"></div>
  <div class="soft">The sky waits for you. Starting over clears your island.</div></div></div>
<div id="title" class="screen" style="display:none"><div class="card"><h1>Abovea</h1><div class="sub">Discover the world beyond the clouds</div>
  <ul class="controls" id="controls"></ul><div id="begin"></div><div class="soft">Press Enter or tap Begin</div></div></div>
<script src="vendor/three.js"></script>
<script src="config.js"></script>
<script src="models.js"></script>
<script src="content.js"></script>
<script src="game.js"></script>
<script>
'use strict';
// The one-shot's starter: only what the checks read. Keep the fixed step, the clock hook,
// window.game and the play and figures scenes. Everything else is the game's own (game.js).

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
let W = innerWidth, H = innerHeight; // the overlay fills the window; the 3D view does too
const PIXEL = false;            // not a pixel look
const FONT = 'ui-rounded, "Segoe UI Rounded", "Nunito", "Trebuchet MS", system-ui, sans-serif';
const TITLE = 'Abovea';
const CONTROLS = [
  'Tap or click: build the chosen piece · the tabs above the toolbar: Homes, Nature, Village, Treasures',
  'Drag: look around · Pinch or mouse wheel: zoom',
  'Two-finger twist, Q / E or right-drag: turn',
  'R, right-click or Rotate: turn the piece before building · T or Turn: turn what you built',
  'V: change view · [ and ]: music down and up',
  'P: pause · M: mute',
]; // shown on the title screen
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen: a 2D overlay for floating words, over the 3D world ---------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { // fills the window at any size and pixel ratio
  W = innerWidth; H = innerHeight;
  const r = devicePixelRatio || 1;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function clearOverlay() { ctx.clearRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center') {
  ctx.fillStyle = c; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function labelText(s, x, y, size, c) {
  ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(46,36,78,0.55)'; ctx.strokeText(s, x, y);
  ctx.fillStyle = c; ctx.fillText(s, x, y);
}
document.getElementById('controls').innerHTML = CONTROLS.map(c => `<li>${c}</li>`).join('');

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code === 'Tab' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());

// Pointer and touch on the world: drag pans, two fingers pinch and twist, a short tap builds.
const worldEl = document.getElementById('world'), pointers = new Map();
let gesture = null;
function twoInfo() {
  const [a, b] = [...pointers.values()];
  return { d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), a: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}
function pan(dx, dy) {
  const c = state.cam, k = c.dist / innerHeight * 1.5;
  const fx = -Math.sin(c.yaw), fz = -Math.cos(c.yaw), rx = Math.cos(c.yaw), rz = -Math.sin(c.yaw);
  c.tx += -rx * dx * k + fx * dy * k; c.tz += -rz * dx * k + fz * dy * k; clampCam();
}
function steerTo(x) { if (state.voyage) state.voyage.tx = ((x / innerWidth) * 2 - 1) * tune.voyageWidth; }
worldEl.addEventListener('pointerdown', e => {
  startAudio();
  try { worldEl.setPointerCapture(e.pointerId); } catch (_) { /* a synthetic pointer */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: clock.now(), btn: e.button, moved: false, multi: false });
  if (pointers.size >= 2) { for (const p of pointers.values()) p.multi = true; gesture = twoInfo(); }
  if (scene === 'play' && state.mode === 'voyage') steerTo(e.clientX);
});
worldEl.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') vis.hover = { x: e.clientX, y: e.clientY };
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (Math.hypot(p.x - p.sx, p.y - p.sy) > 8) p.moved = true;
  if (scene !== 'play') return;
  if (state.mode === 'voyage') { steerTo(e.clientX); return; }
  if (state.view !== 'builder' || state.modal) return;
  if (pointers.size >= 2) {
    const g = twoInfo();
    if (gesture) { zoom(gesture.d / g.d); state.cam.yaw += g.a - gesture.a; pan(g.mx - gesture.mx, g.my - gesture.my); }
    gesture = g; return;
  }
  if (!p.moved || p.multi) return;
  if (p.btn === 2 || e.shiftKey) state.cam.yaw -= dx * 0.008; else pan(dx, dy);
});
function pointerUp(e) {
  const p = pointers.get(e.pointerId); if (!p) return;
  pointers.delete(e.pointerId); if (pointers.size < 2) gesture = null;
  if (!p.moved && !p.multi && p.btn === 0 && clock.now() - p.t < 0.6 && scene === 'play') taps.push({ x: p.x, y: p.y });
  if (!p.moved && p.btn === 2 && scene === 'play') hit.add('KeyR'); // right-click turns the piece about to be built
}
worldEl.addEventListener('pointerup', pointerUp);
worldEl.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); gesture = null; });
worldEl.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') vis.hover = null; });
worldEl.addEventListener('wheel', e => { e.preventDefault(); if (scene === 'play' && state.view === 'builder') zoom(Math.exp(e.deltaY * 0.0012)); }, { passive: false });
worldEl.addEventListener('contextmenu', e => e.preventDefault());

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows

// ---- Scenes ------------------------------------------------------------------------------
// title: always. pause: real-time. No game over and no results: Abovea has no failure and no
// end you must reach; Start over (in pause) is the restart.
// figures: every unit and piece side by side, for the outline check (?scene=figures).
let scene, state;
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = newState(); // state.gained: the islands this sky has found
}
const scenes = {
  figures: {
    update() { },
    draw() { drawFigures(); },
  },
  title: {
    update(dt) {
      if (pressed('Enter') || pressed('Space')) { reset(); resetWorld(); scene = 'play'; return; }
      state.t += dt; camStep(dt); fxStep(dt); musicStep();
    },
    draw() { drawTitleWorld(); updateUI(); },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      playStep(dt);
    },
    draw() { drawWorld(); updateUI(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; musicStep(); },
    draw() { drawWorld(); updateUI(); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

generateWorld(Number(params.get("world")) || 0);
reset();
initWorld(); initUI();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
